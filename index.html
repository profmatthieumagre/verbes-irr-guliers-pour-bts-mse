<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verbes irréguliers anglais</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1d2733;
    --muted: #5d6b7a;
    --line: #d9e0e7;
    --head: #eef3f8;
    --accent: #1f5f99;
    --ok-bg: #e3f4e6;
    --ok: #1c7a34;
    --ko-bg: #fbe6e4;
    --ko: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;
      --text: #e6ebf0;
      --muted: #97a4b1;
      --line: #2c353f;
      --head: #1e252d;
      --accent: #7fb6e8;
      --ok-bg: #16351f;
      --ok: #7fd394;
      --ko-bg: #3d1e1b;
      --ko: #f0958e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
  }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  h2 { font-size: 1.3rem; margin: 40px 0 12px; }
  p.intro { color: var(--muted); margin: 0 0 20px; }
  nav { display: flex; gap: 8px; margin-bottom: 8px; font-family: system-ui, sans-serif; }
  nav button {
    font: inherit; padding: 8px 14px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); border-radius: 6px; cursor: pointer;
  }
  nav button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { nav button[aria-selected="true"] { color: #10161c; } }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 1rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--head); font-family: system-ui, sans-serif; font-size: .9rem; }
  td.inf { font-weight: bold; }
  #quiz input {
    width: 100%; min-width: 90px; font: inherit; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--text);
  }
  #quiz input.ok { background: var(--ok-bg); border-color: var(--ok); }
  #quiz input.ko { background: var(--ko-bg); border-color: var(--ko); }
  .answer { display: block; font-size: .85rem; color: var(--ko); margin-top: 2px; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; font-family: system-ui, sans-serif; flex-wrap: wrap; }
  .actions button {
    font: inherit; padding: 9px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  @media (prefers-color-scheme: dark) { .actions button { color: #10161c; } }
  .actions button.secondary { background: var(--bg); color: var(--accent); }
  #score { font-weight: bold; }
  .consigne { color: var(--muted); margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <h1>Verbes irréguliers anglais</h1>
  <p class="intro">Les 50 verbes irréguliers les plus courants, classés par ordre alphabétique de l’infinitif anglais.</p>

  <h2>La liste</h2>
  <div class="wrap">
    <table id="liste">
      <thead>
        <tr><th>Français</th><th>Infinitif</th><th>Prétérit</th><th>Participe passé</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <h2>Le quiz</h2>
  <nav role="tablist" aria-label="Niveau du quiz">
    <button role="tab" data-n="1" aria-selected="true">Niveau 1</button>
    <button role="tab" data-n="2" aria-selected="false">Niveau 2</button>
    <button role="tab" data-n="3" aria-selected="false">Niveau 3</button>
  </nav>
  <p class="consigne" id="consigne"></p>

  <section id="quiz">
    <div class="wrap">
      <table>
        <thead>
          <tr><th>Français</th><th>Infinitif</th><th>Prétérit</th><th>Participe passé</th></tr>
        </thead>
        <tbody id="quizBody"></tbody>
      </table>
    </div>
    <div class="actions">
      <button id="check">Corriger</button>
      <button id="again" class="secondary">Nouvelle série</button>
      <span id="score" aria-live="polite"></span>
    </div>
  </section>
</main>

<script>
const VERBES = [
  ["être", "be", "was / were", "been"],
  ["devenir", "become", "became", "become"],
  ["commencer", "begin", "began", "begun"],
  ["casser", "break", "broke", "broken"],
  ["apporter", "bring", "brought", "brought"],
  ["construire", "build", "built", "built"],
  ["acheter", "buy", "bought", "bought"],
  ["attraper", "catch", "caught", "caught"],
  ["choisir", "choose", "chose", "chosen"],
  ["venir", "come", "came", "come"],
  ["couper", "cut", "cut", "cut"],
  ["faire", "do", "did", "done"],
  ["boire", "drink", "drank", "drunk"],
  ["conduire", "drive", "drove", "driven"],
  ["manger", "eat", "ate", "eaten"],
  ["tomber", "fall", "fell", "fallen"],
  ["ressentir", "feel", "felt", "felt"],
  ["trouver", "find", "found", "found"],
  ["voler (dans les airs)", "fly", "flew", "flown"],
  ["oublier", "forget", "forgot", "forgotten"],
  ["obtenir", "get", "got", "got / gotten"],
  ["donner", "give", "gave", "given"],
  ["aller", "go", "went", "gone / been"],
  ["grandir", "grow", "grew", "grown"],
  ["avoir", "have", "had", "had"],
  ["entendre", "hear", "heard", "heard"],
  ["garder", "keep", "kept", "kept"],
  ["savoir", "know", "knew", "known"],
  ["partir", "leave", "left", "left"],
  ["perdre", "lose", "lost", "lost"],
  ["fabriquer", "make", "made", "made"],
  ["rencontrer", "meet", "met", "met"],
  ["payer", "pay", "paid", "paid"],
  ["mettre", "put", "put", "put"],
  ["lire", "read", "read", "read"],
  ["courir", "run", "ran", "run"],
  ["dire", "say", "said", "said"],
  ["voir", "see", "saw", "seen"],
  ["vendre", "sell", "sold", "sold"],
  ["envoyer", "send", "sent", "sent"],
  ["dormir", "sleep", "slept", "slept"],
  ["parler", "speak", "spoke", "spoken"],
  ["prendre", "take", "took", "taken"],
  ["enseigner", "teach", "taught", "taught"],
  ["raconter", "tell", "told", "told"],
  ["penser", "think", "thought", "thought"],
  ["comprendre", "understand", "understood", "understood"],
  ["porter (un vêtement)", "wear", "wore", "worn"],
  ["gagner", "win", "won", "won"],
  ["écrire", "write", "wrote", "written"]
].sort((a, b) => a[1].localeCompare(b[1]));

// ----- Liste -----
const tbody = document.querySelector("#liste tbody");
VERBES.forEach(([fr, inf, pret, pp]) => {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${fr}</td><td class="inf">${inf}</td><td>${pret}</td><td>${pp}</td>`;
  tbody.appendChild(tr);
});

// ----- Quiz -----
const NB_QUESTIONS = 10;
const CONSIGNES = {
  1: "Complétez la case vide dans chaque ligne (1 colonne sur 4 à remplir).",
  2: "Complétez les 2 cases vides dans chaque ligne (2 colonnes sur 4 à remplir).",
  3: "Complétez les 3 cases vides dans chaque ligne (3 colonnes sur 4 à remplir)."
};
let niveau = 1;
let serie = [];

function normaliser(s) {
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/^to\s+/, "")
    .replace(/\s+/g, " ")
    .trim();
}

function reponsesAcceptees(attendu) {
  const complet = normaliser(attendu.replace(/\s*\(.*?\)\s*/g, " "));
  const parties = attendu.split("/").map(p => normaliser(p.replace(/\s*\(.*?\)\s*/g, " ")));
  return [complet, complet.replace(/\s*\/\s*/g, "/"), ...parties];
}

function melanger(tab) {
  const a = tab.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function nouvelleSerie() {
  const verbes = melanger(VERBES).slice(0, NB_QUESTIONS)
    .sort((a, b) => a[1].localeCompare(b[1]));
  serie = verbes.map(v => ({ verbe: v, vides: melanger([0, 1, 2, 3]).slice(0, niveau) }));
  const body = document.getElementById("quizBody");
  body.innerHTML = "";
  serie.forEach((q, i) => {
    const tr = document.createElement("tr");
    q.verbe.forEach((valeur, col) => {
      const td = document.createElement("td");
      if (q.vides.includes(col)) {
        const input = document.createElement("input");
        input.type = "text";
        input.autocomplete = "off";
        input.autocapitalize = "off";
        input.spellcheck = false;
        input.dataset.row = i;
        input.dataset.col = col;
        input.setAttribute("aria-label", ["Français", "Infinitif", "Prétérit", "Participe passé"][col] + ", ligne " + (i + 1));
        td.appendChild(input);
      } else {
        td.textContent = valeur;
        if (col === 1) td.className = "inf";
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  document.getElementById("score").textContent = "";
  document.getElementById("consigne").textContent = CONSIGNES[niveau];
}

function corriger() {
  const inputs = document.querySelectorAll("#quizBody input");
  let bons = 0;
  inputs.forEach(input => {
    input.parentNode.querySelectorAll(".answer").forEach(n => n.remove());
    const attendu = serie[input.dataset.row].verbe[input.dataset.col];
    const ok = reponsesAcceptees(attendu).includes(normaliser(input.value));
    input.classList.toggle("ok", ok);
    input.classList.toggle("ko", !ok);
    if (ok) bons++;
    else {
      const span = document.createElement("span");
      span.className = "answer";
      span.textContent = attendu;
      input.parentNode.appendChild(span);
    }
  });
  document.getElementById("score").textContent = `Score : ${bons} / ${inputs.length}`;
}

document.getElementById("check").addEventListener("click", corriger);
document.getElementById("again").addEventListener("click", nouvelleSerie);
document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    niveau = Number(btn.dataset.n);
    document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b === btn));
    nouvelleSerie();
  });
});
document.getElementById("quizBody").addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  const inputs = [...document.querySelectorAll("#quizBody input")];
  const i = inputs.indexOf(e.target);
  if (i < inputs.length - 1) inputs[i + 1].focus();
  else corriger();
});

nouvelleSerie();
</script>
</body>
</html>
